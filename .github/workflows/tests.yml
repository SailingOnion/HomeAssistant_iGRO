name: Tests & Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python Tests & Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint Python with Ruff
        run: ruff check custom_components tests

      - name: Validate YAML & JSON files
        run: |
          python -c "
          import json, pathlib, yaml
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          for p in pathlib.Path('custom_components').rglob('*.yaml'):
              yaml.safe_load(p.read_text(encoding='utf-8'))
          print('All JSON and YAML files are valid.')
          "

      - name: Run pytest
        run: pytest -v

  frontend-check:
    name: Frontend JS Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check ES module syntax
        run: |
          for f in custom_components/igro/frontend/*.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done
