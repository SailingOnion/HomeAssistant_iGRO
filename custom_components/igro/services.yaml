log_action:
  name: Log grow action
  description: Record a watering, feeding, training, measurement, or note entry in the iGro journal.
  fields:
    plant:
      name: Plant
      description: Plant ID or exact plant name.
      example: "Northern Lights #1"
      selector:
        text:
    log_type:
      name: Action type
      description: Type of grow action to log.
      required: true
      default: water
      selector:
        select:
          options:
            - water
            - feed
            - training
            - defoliation
            - measurement
            - transplant
            - flush
            - pest_issue
            - note
    title:
      name: Title
      description: Optional short summary.
      selector:
        text:
    notes:
      name: Notes
      description: Detailed observations.
      selector:
        text:
          multiline: true
    water_volume_ml:
      name: Water volume (mL)
      selector:
        number:
          min: 0
          max: 50000
          unit_of_measurement: mL
    ph:
      name: Input pH
      selector:
        number:
          min: 0
          max: 14
          step: 0.1
    ec:
      name: Input EC (mS/cm)
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
    ppm:
      name: Input PPM
      selector:
        number:
          min: 0
          max: 5000
    height_cm:
      name: Plant height (cm)
      selector:
        number:
          min: 0
          max: 500
          step: 0.5
    training_method:
      name: Training method
      example: "LST"
      selector:
        text:
    preset:
      name: Nutrient preset
      description: Optional saved nutrient preset ID or name to auto-fill nutrients, target pH, and target EC.
      example: "Veg Week 3 Base"
      selector:
        text:
    logged_at:
      name: Date & Time (ISO-8601)
      description: Optional past (backdated) or future (scheduled) date/time. Defaults to now.
      example: "2026-11-20T18:00:00Z"
      selector:
        text:
    status:
      name: Status
      description: Mark as completed or planned (auto-detected from future date if omitted).
      selector:
        select:
          options:
            - completed
            - planned

set_stage:
  name: Set plant stage
  description: Transition a plant to a specific grow lifecycle stage (supports past backdating or future scheduling).
  fields:
    plant:
      name: Plant
      description: Plant ID or exact plant name.
      required: true
      selector:
        text:
    stage:
      name: Stage
      required: true
      selector:
        select:
          options:
            - germination
            - seedling
            - vegetative
            - flowering
            - drying
            - curing
            - harvested
            - archived
    notes:
      name: Notes
      selector:
        text:
    changed_at:
      name: Transition Date (ISO-8601)
      description: Optional past date to backdate or future date to schedule the stage change.
      example: "2026-12-01"
      selector:
        text:
    auto_apply:
      name: Auto-apply when due
      description: When scheduling a future date, automatically transition the plant when the date arrives.
      default: true
      selector:
        boolean:

advance_stage:
  name: Advance plant stage
  description: Move a plant to the next lifecycle stage in order.
  fields:
    plant:
      name: Plant
      description: Plant ID or exact plant name.
      required: true
      selector:
        text:
    notes:
      name: Notes
      selector:
        text:

capture_photo:
  name: Capture camera photo
  description: Take a snapshot from a Home Assistant camera entity and save it to the iGro photo journal.
  fields:
    plant:
      name: Plant
      description: Plant ID or exact plant name.
      selector:
        text:
    camera_entity_id:
      name: Camera entity
      description: Optional override; uses the plant's or tent's linked camera if omitted.
      selector:
        entity:
          domain: camera
    caption:
      name: Caption
      selector:
        text:

create_plant:
  name: Create plant
  description: Add a new plant to iGro.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    strain:
      name: Strain / Cultivar
      selector:
        text:
    breeder:
      name: Breeder
      selector:
        text:
    plant_type:
      name: Plant type
      default: photoperiod
      selector:
        select:
          options:
            - photoperiod
            - autoflower
            - clone
            - vegetable
            - herb
            - houseplant
            - other
    medium:
      name: Grow medium
      default: soil
      selector:
        select:
          options:
            - soil
            - coco
            - hydroponic
            - dwc
            - aeroponic
            - living_soil
            - rockwool
            - other
    stage:
      name: Initial stage
      default: germination
      selector:
        select:
          options:
            - germination
            - seedling
            - vegetative
            - flowering
            - drying
            - curing
    notes:
      name: Notes
      selector:
        text:
          multiline: true

record_harvest:
  name: Record harvest & yield
  description: Record or update wet/dry/trim weights, rating, and curing notes for a plant.
  fields:
    plant:
      name: Plant
      description: Plant ID or exact plant name.
      required: true
      selector:
        text:
    wet_weight_g:
      name: Wet weight (g)
      selector:
        number:
          min: 0
          max: 50000
          step: 0.1
          unit_of_measurement: g
    dry_weight_g:
      name: Dry weight (g)
      selector:
        number:
          min: 0
          max: 50000
          step: 0.1
          unit_of_measurement: g
    trim_weight_g:
      name: Trim / larf weight (g)
      selector:
        number:
          min: 0
          max: 50000
          step: 0.1
          unit_of_measurement: g
    rating:
      name: Rating (1–5)
      selector:
        number:
          min: 1
          max: 5
          step: 1
    is_keeper:
      name: Phenotype keeper
      default: false
      selector:
        boolean:
    aroma_notes:
      name: Aroma / terpene notes
      selector:
        text:
    effect_notes:
      name: Effect / smoke notes
      selector:
        text:
    set_plant_stage:
      name: Update plant stage
      selector:
        select:
          options:
            - drying
            - curing
            - harvested
            - archived
    notes:
      name: Notes
      selector:
        text:
          multiline: true

create_reminder:
  name: Create grow reminder
  description: Schedule a one-time or recurring reminder (appears in iGro, HA Calendar, and HA To-Do).
  fields:
    title:
      name: Title
      required: true
      example: "Water Northern Lights #1"
      selector:
        text:
    plant:
      name: Plant
      description: Optional plant ID or exact plant name.
      selector:
        text:
    action_type:
      name: Action type
      default: water
      selector:
        select:
          options:
            - water
            - feed
            - training
            - defoliation
            - measurement
            - flush
            - burp_jars
            - stage_change
            - note
    due_at:
      name: Due date/time (ISO-8601)
      selector:
        text:
    recurrence_days:
      name: Repeat every (days)
      selector:
        number:
          min: 1
          max: 365
    moisture_threshold:
      name: Soil moisture trigger (%)
      description: Mark due early if linked plant's soil moisture drops below this threshold.
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
    auto_log_on_complete:
      name: Auto-log to journal when completed
      default: true
      selector:
        boolean:
    notes:
      name: Notes
      selector:
        text:
          multiline: true

complete_reminder:
  name: Complete grow reminder
  description: Mark a reminder completed (advances recurring schedule and optionally creates a journal entry).
  fields:
    reminder_id:
      name: Reminder ID
      required: true
      selector:
        text:
    create_log:
      name: Create journal log entry
      selector:
        boolean:
